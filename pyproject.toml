[project]
name = "flask-dramatiq"
version = "0.7.0"
description = "Adds Dramatiq support to your Flask application"
authors = [{ name = "Étienne BERSAC" }]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["dramatiq>=1.5,<3", "flask>=2"]

[project.urls]
Homepage = "https://pypi.org/project/flask-dramatiq"
Documentation = "https://flask-dramatiq.rtfd.io"

[project.entry-points."flask.commands"]
periodiq = "flask_dramatiq:periodiq"
worker = "flask_dramatiq:worker"

[dependency-groups]
dev = [
    "flask-sqlalchemy>=3.1",
    "dramatiq[rabbitmq,watch]>=1.5,<3",
    "psycopg2-binary>=2.9.5,<3",
    "flask-migrate>=4",
    "pytest>=7",
    "pytest-mock>=3",
    "pytest-cov>=3",
    "periodiq>=0.11.0,<1",
    "httpx>=0.19.0,<1",
    "setuptools>=59",
    "watchdog>=2.3",
    "watchdog-gevent>=0.2",
    "tox>=4.22",
    "tox-uv>=1.20",
    "prek>=0.4.3",
]
doc = [
    "sphinx>=4",
    "Pallets-Sphinx-Themes>=1.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.20"]
env_list = ["3.10", "3.11", "3.12", "3.13", "3.14", "dramatiq1", "minversions", "style", "docs"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["pytest", "-x", "tests/unit/"]]

[tool.tox.env.dramatiq1]
description = "test against dramatiq 1.x"
runner = "uv-venv-runner"
base_python = ["3.13"]
constrain_package_deps = true
deps = ["dramatiq<2"]

[tool.tox.env.minversions]
description = "test against the lowest versions of direct dependencies"
runner = "uv-venv-runner"
base_python = ["3.10"]
uv_resolution = "lowest-direct"

[tool.tox.env.style]
description = "run prek hooks"
base_python = ["3.13"]
commands = [["prek", "run", "--all-files", "--show-diff-on-failure"]]

[tool.tox.env.docs]
description = "build sphinx documentation"
base_python = ["3.13"]
dependency_groups = ["doc"]
commands = [["sphinx-build", "-M", "html", "docs/source", "docs/build", "-Wvn"]]

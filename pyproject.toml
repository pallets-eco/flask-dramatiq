[project]
name = "flask-dramatiq"
version = "0.7.0"
description = "Adds Dramatiq support to your Flask application"
authors = [{ name = "Étienne BERSAC" }]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["dramatiq>=1.5,<2", "flask>=2"]

[project.urls]
Homepage = "https://pypi.org/project/flask-dramatiq"
Documentation = "https://flask-dramatiq.rtfd.io"

[project.entry-points."flask.commands"]
periodiq = "flask_dramatiq:periodiq"
worker = "flask_dramatiq:worker"

[dependency-groups]
dev = [
    "flake8>=5",
    "flask-sqlalchemy>=3",
    "dramatiq[rabbitmq,watch]>=1.5,<2",
    "psycopg2-binary>=2.7,<3",
    "flask-migrate>=4",
    "pytest>=7",
    "pytest-mock>=3",
    "pytest-cov>=3",
    "periodiq>=0.11.0,<1",
    "httpx>=0.19.0,<1",
    "setuptools",
]
doc = [
    "sphinx>=4",
    "Pallets-Sphinx-Themes>=1.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

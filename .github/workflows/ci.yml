name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group doc

      - name: Build docs
        run: uv run sphinx-build -M html docs/source docs/build -Wvn

  minversions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install minimum versions
        run: uv sync --python 3.10 --resolution lowest-direct --upgrade

      - name: Unit tests
        run: uv run pytest -x tests/unit/

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:11-alpine
        env:
          POSTGRES_PASSWORD: tondeuse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BROKER_URL: amqp://localhost
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: tondeuse

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run flake8 example.py flask_dramatiq.py tests/func/

      - name: Database migration
        run: uv run ./example.py db upgrade

      - name: Unit tests
        run: uv run pytest -x tests/unit/

      - name: Functional tests
        run: uv run pytest -x tests/func/
